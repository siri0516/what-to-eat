            background: #0a0a14;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #app {
            background: #12121e;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.04);
            max-width: 520px;
            width: 100%;
        }
        h1 { text-align: center; color: #fff; font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 0.15rem; }
        .sub { text-align: center; color: rgba(255,255,255,0.12); font-size: 0.78rem; margin-bottom: 1.3rem; letter-spacing: 1px; }

        /* weather */
        .sec-label {
            color: rgba(255,255,255,0.25);
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        /* mood */
        .btn-group {
            display: grid;
            gap: 6px;
            margin-bottom: 1rem;
        }
        #meal-btns { grid-template-columns: repeat(4, 1fr); }
        #weather-btns, #temp-btns, #mood-btns { grid-template-columns: repeat(5, 1fr); }
        .m-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 0.5rem 0.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .m-btn:hover { background: rgba(255,255,255,0.06); }
        .m-btn.sel {
            background: rgba(78,156,255,0.12);
            border-color: #4e9cff;
        }
        .m-btn.sel .ml { color: #4e9cff; }
        .m-btn .emoji { font-size: 1.3rem; display: block; margin-bottom: 0.1rem; }
        .m-btn .ml { color: rgba(255,255,255,0.35); font-size: 0.65rem; }

        /* sliders */
        .sl-g {
            margin-bottom: 0.8rem;
        }
        .sl-h {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        .sl-h .l { color: rgba(255,255,255,0.4); font-size: 0.78rem; }
        .sl-h .v { color: #fff; font-size: 0.8rem; min-width: 40px; text-align: right; }

            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            outline: none;
            touch-action: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #4e9cff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(78,156,255,0.3);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #4e9cff;
            cursor: pointer;
            border: none;
        }

        .sl-l {
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.1);
            font-size: 0.62rem;
            margin-top: 0.1rem;
        }

        /* button */
        #go-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #e94560, #d63851);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(233,69,96,0.25);
            margin-top: 0.2rem;
        }
        #go-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(233,69,96,0.4);
        }
        #go-btn:active { transform: scale(0.98); }

        #result {
            display: none;
            margin-top: 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(78,204,163,0.15);
            border-radius: 14px;
            padding: 1.4rem;
            text-align: center;
            animation: up 0.4s ease-out;
        }
        #result.show { display: block; }
        @keyframes up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #result .rn { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.2rem; }

            font-size: 0.75rem;

            background: rgba(255,255,255,0.04);

        #fb .fb-dislike.act { opacity: 1; border-color: #ff6b6b; background: rgba(255,107,107,0.12); }

        #ra {

        }

            color: rgba(255,255,255,0.3);
            font-size: 0.72rem;
            cursor: pointer;

    <!-- 结果 -->

</div>

// ========== Toast 轻提示 ==========

function showToast(msg) {
    const existing = document.querySelector('.wt-toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'wt-toast';
    t.textContent = msg;
    Object.assign(t.style, {
        position: 'fixed', bottom: '100px', left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(0,0,0,0.85)', color: '#fff', padding: '10px 20px',
        borderRadius: '12px', fontSize: '0.85rem', zIndex: '10000',
        maxWidth: '320px', textAlign: 'center',
        backdropFilter: 'blur(10px)', border: '1px solid rgba(255,255,255,0.1)',
        transition: 'opacity 0.4s'
    });
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2500);
}

// ---------- DOM 引用 ----------
const $ = id => document.getElementById(id);

// ---------- 反馈系统 ----------
let _curFood = null;

function loadFB() {
    try { return JSON.parse(localStorage.getItem('food_feedback')) || {}; } catch { return {}; }
}
function saveFB(fb) { localStorage.setItem('food_feedback', JSON.stringify(fb)); }

function giveFB(name, type) {
    const fb = loadFB();
    const cur = fb[name] || 0;
    // 点击已激活的按钮 -> 取消反馈；否则设置
    if (type === 'like') {
        fb[name] = cur > 0 ? 0 : 1;
    } else {
        fb[name] = cur < 0 ? 0 : -1;
    }
    saveFB(fb);
    updateFBUI();
}

function updateFBUI() {
    if (!_curFood) return;
    const fb = loadFB();
    const val = fb[_curFood.name] || 0;
    const likeBtn = document.querySelector('.fb-like');
    const dislikeBtn = document.querySelector('.fb-dislike');
    if (!likeBtn) return;
    likeBtn.classList.toggle('act', val > 0);
    dislikeBtn.classList.toggle('act', val < 0);
}

        const as = food.scores.appetite[a] || 0;
        const fs = food.scores.fullness[f] || 0;
        const fbAdj = (fb[food.name] || 0) * 1.5;
        const mealScores = MEAL_SCORES[food.name] || {};
        const mealS = mealScores[meal] || 0;
        const total = ws * 1.0 + ms * 1.5 + as * 1.5 + fs * 2.0 + mealS * 1.5 + fbAdj;
        return { food, total, ws, ms, as, fs, mealS };
    });

    // 过滤掉不适宜该餐段的食物（如早餐不出小龙虾）
    scored = scored.filter(item => item.mealS >= 0);

    scored.sort((a, b) => {
        if (Math.abs(b.total - a.total) < 0.5) return Math.random() - 0.5;
        return b.total - a.total;
    });

    // 从 top 3 随机
    const idx = Math.random() < 0.65 ? 0 : (Math.random() < 0.5 ? 1 : 2);
    const pick = scored[Math.min(idx, scored.length - 1)];

    // 原因
    let parts = [];
    if (pick.ws > 0) {
        const wl = {sunny:'晴天',cloudy:'多云',overcast:'阴天',foggy:'起雾',rainy:'下雨天'};
        parts.push(wl[wType] || '');
    }
    if (pick.ms > 0) {
        const ml = {happy:'开心',sad:'难过',stressed:'压力大',tired:'疲惫',bored:'无聊'};
        parts.push(ml[mood] || '');
    }
    if (pick.as > 0) {
        const al = {low:'没胃口',normal:'食欲正好',high:'胃口大开'};
        parts.push(al[a] || '');
    }
    if (pick.fs > 0) {
        const fl = {hungry:'肚子饿',light:'刚好',full:'有点饱'};
        parts.push(fl[f] || '');
    }
    if (pick.mealS > 0) {
        const mealL = {breakfast:'适合早餐', lunch:'适合午餐', dinner:'适合晚餐', night:'适合夜宵'};
        parts.push(mealL[meal] || '');
    }

    const reason = pick.food.reason(wType, mood, a, f, meal);
    const extra = parts.length > 0 ? `<br><span style="font-size:0.7rem;color:rgba(255,255,255,0.2);">综合：${parts.join(' · ')}</span>` : '';

    return {
        name: pick.food.name,
        emoji: pick.food.emoji || '🍽️',
        desc: pick.food.desc,
        reason: `<strong>${reason}</strong>${extra}`
    };
}

// ---------- 显示结果 ----------
function showResult() {
    const r = getRecommendation();
    _curFood = r;
    $('re').textContent = r.emoji;
    $('rn').textContent = r.name;
    $('rd').textContent = r.desc;
    $('rr').innerHTML = r.reason;
    $('result').classList.add('show');
    updateFBUI();
}

// ---------- 绑定事件 ----------
document.addEventListener('DOMContentLoaded', function() {

    // 餐类按钮
    document.querySelectorAll('#meal-btns .m-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#meal-btns .m-btn').forEach(b => b.classList.remove('sel'));
            this.classList.add('sel');
            meal = this.dataset.meal;
        });
    });

    // 天气状况按钮
    document.querySelectorAll('#weather-btns .m-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#weather-btns .m-btn').forEach(b => b.classList.remove('sel'));
            this.classList.add('sel');
            wType = this.dataset.w;
        });
    });

    // 气温按钮
    document.querySelectorAll('#temp-btns .m-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#temp-btns .m-btn').forEach(b => b.classList.remove('sel'));
            this.classList.add('sel');
            temp = this.dataset.t;
        });
    });

    // 心情按钮
    document.querySelectorAll('#mood-btns .m-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#mood-btns .m-btn').forEach(b => b.classList.remove('sel'));
            this.classList.add('sel');
            mood = this.dataset.m;
        });
    });

    // 食欲 slider
    const aLabels = ['完全没胃口','不太想吃','刚刚好','胃口不错','胃口大开'];
    $('as').addEventListener('input', function() {
        appetite = Math.round(parseFloat(this.value));
        $('av').textContent = aLabels[appetite];
    });

    // 饱腹 slider
    const fLabels = ['饿扁了','有点饿','正合适','有点撑','撑爆了'];
    $('fs').addEventListener('input', function() {
        fullness = Math.round(parseFloat(this.value));
        $('fv').textContent = fLabels[fullness];
    });

    // 主按钮
    $('go-btn').addEventListener('click', showResult);

    // 换一个
    $('r-btn').addEventListener('click', showResult);

    // 反馈按钮
    document.querySelector('.fb-like').addEventListener('click', function() {
        if (_curFood) giveFB(_curFood.name, 'like');
    });
    document.querySelector('.fb-dislike').addEventListener('click', function() {
        if (_curFood) giveFB(_curFood.name, 'dislike');
    });

    // 复制
    $('c-btn').addEventListener('click', function() {
        const text = `🍽️ 今天推荐吃：${$('re').textContent} ${$('rn').textContent}\n${$('rd').textContent}`;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                this.textContent = '✅ 已复制';
                setTimeout(() => { this.textContent = '📋 复制'; }, 2000);
            });
        } else {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            this.textContent = '✅ 已复制';
            setTimeout(() => { this.textContent = '📋 复制'; }, 2000);
        }
    });

    // 初始化（按钮组默认已设置好 sel 状态）
});

// Register service worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
    });
}
</script>
